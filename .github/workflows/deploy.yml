name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: rock-paper-scissor-stati
  INSTANCE_ID: i-0636d6d516e700271
  SERVER_NAME: rock-paper-scissor-stati-server
  PUBLIC_IP: 13.204.136.169
  PUBLIC_URL: http://13.204.136.169
  TARGET_PORT: 80
  DOCKERFILE_PATH: .
  SECRET_ID: deptic/rock_paper_scissor_static/secrets

jobs:
  deploy:
    name: Build, Push, Deploy and Verify
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inspect repository content
        run: |
          set -e
          echo "==> Repository tree:"
          ls -laR . || true
          echo "==> Static site evidence:"
          test -f index.html && echo "index.html present"
          test -f style.css && echo "style.css present"
          test -f script.js && echo "script.js present"
          grep -o '<title>[^<]*</title>' index.html || true
          echo "==> Target topology:"
          echo "service=EC2_DOCKER region=$AWS_REGION instance=$INSTANCE_ID"
          echo "registry=$ECR_REGISTRY/$ECR_REPOSITORY port=$TARGET_PORT"

      - name: Ensure Dockerfile exists for static site context
        run: |
          set -e
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile found - generating nginx container for static content"
            cat > Dockerfile << 'DOCKERFILE'
            FROM nginx:alpine
            COPY . /usr/share/nginx/html
            EXPOSE 80
            DOCKERFILE
          fi
          echo "==> Dockerfile:"
          cat Dockerfile

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${AWS_REGION:-ap-south-1}"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM RunShellScript
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${AWS_REGION:-ap-south-1}"

          REGION="$AWS_DEFAULT_REGION"
          INSTANCE_ID="$INSTANCE_ID"

          # Dynamic resolution: if INSTANCE_ID missing or not running, locate by tag
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$REGION" \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null \
              | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "==> Resolved instance: $INSTANCE_ID"
            else
              echo "ERROR: no running instance found"; exit 1
            fi
          fi

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/rock-paper-scissor-stati:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/rock-paper-scissor-stati:latest"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"

          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --region "$REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "SSM command failed"; exit 1 ;;
            esac
            sleep 5
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command did not succeed"; exit 1; }
          echo "==> Deploy command completed successfully"

      - name: Verify deployment - health check HTTP 200
        run: |
          set -e
          URL="$PUBLIC_URL"
          echo "Waiting for $URL to serve HTTP 200..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" "$URL" || true)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "==> Health check passed"
              grep -i "Rock Paper Scissor" /tmp/health.html || true
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed - never received HTTP 200"
          exit 1

    outputs:
      public_ip: 13.204.136.169
      public_url: http://13.204.136.169
      alb_dns_name: 13.204.136.169
      instance_id: i-0636d6d516e700271
      ecr_repo_url: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/rock-paper-scissor-stati
      security_group_id: sg-0bbe7f166528c56cd
      iam_instance_profile: rock-paper-scissor-stati-instance-profile
      iam_role: rock-paper-scissor-stati-ec2-role