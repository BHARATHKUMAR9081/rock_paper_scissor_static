name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: rock-paper-scissor-stati
  INSTANCE_ID: i-0636d6d516e700271
  SERVER_NAME: rock-paper-scissor-stati-server
  PUBLIC_IP: 13.204.136.169
  PUBLIC_URL: http://13.204.136.169
  TARGET_PORT: 80
  DOCKERFILE_PATH: .
  SECRET_ID: deptic/rock_paper_scissor_static/secrets

jobs:
  deploy:
    name: Build, Push, Deploy and Verify
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inspect repository content
        run: |
          set -e
          echo "==> Repository tree:"
          ls -laR . || true
          echo "==> Static site evidence:"
          test -f index.html && echo "index.html present"
          test -f style.css && echo "style.css present"
          test -f script.js && echo "script.js present"
          grep -o '<title>[^<]*</title>' index.html || true
          echo "==> Target topology:"
          echo "service=EC2_DOCKER region=$AWS_REGION instance=$INSTANCE_ID"
          echo "registry=$ECR_REGISTRY/$ECR_REPOSITORY port=$TARGET_PORT"

      - name: Ensure Dockerfile exists for static site context
        run: |
          set -e
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile found - generating nginx container for static content"
            cat > Dockerfile << 'DOCKERFILE'
            FROM nginx:alpine
            COPY . /usr/share/nginx/html
            EXPOSE 80
            DOCKERFILE
          fi
          echo "==> Dockerfile:"
          cat Dockerfile

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${AWS_REGION:-ap-south-1}"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM RunShellScript
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${AWS_REGION:-ap-south-1}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "==> SSM parameters payload:"
          cat /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_DEFAULT_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_DEFAULT_REGION" \
              --query "Status" --output text || echo "Pending")
            echo "attempt=$i status=$STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM command succeeded"; exit 0; fi
            case "$STATUS" in
              Failed|Cancelled|TimedOut) echo "SSM command failed"; exit 1;;
            esac
            sleep 10
          done
          echo "SSM command timed out"; exit 1

      - name: Verify deployment - health check expects HTTP 200
        run: |
          set -e
          echo "Waiting for container to serve on $PUBLIC_URL ..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /tmp/response.html -w "%{http_code}" "$PUBLIC_URL" || true)
            echo "attempt=$i http_code=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              grep -o '<title>[^<]*</title>' /tmp/response.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed - site not reachable"
          exit 1

      - name: Summary - target outputs
        if: always()
        run: |
          echo "public_ip=13.204.136.169"
          echo "public_url=http://13.204.136.169"
          echo "alb_dns_name=13.204.136.169"
          echo "instance_id=i-0636d6d516e700271"
          echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/rock-paper-scissor-stati"
          echo "security_group_id=sg-0bbe7f166528c56cd"
          echo "iam_instance_profile=rock-paper-scissor-stati-instance-profile"
          echo "iam_role=rock-paper-scissor-stati-ec2-role"